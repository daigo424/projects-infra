name: terraform-apply

on:
  workflow_dispatch:
    inputs:
      target_name:
        description: "Terraform target name (例: platform/access, workloads/project-a/envs:prod, workloads/project-a/bootstrap:prod)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject template
        run: |
          case "${{ github.event.inputs.target_name }}" in
            _template*)
              echo "_template must never be applied" >&2
              exit 1
              ;;
          esac

      - name: Build target map
        id: targets
        run: |
          TARGETS="$(python .github/scripts/discover_targets.py)"
          echo "targets=${TARGETS}" >> "$GITHUB_OUTPUT"

      - name: Select target
        id: select
        run: |
          SELECTED="$(echo '${{ steps.targets.outputs.targets }}' | jq -c '.[] | select(.name == "${{ github.event.inputs.target_name }}")')"
          if [ -z "$SELECTED" ]; then
            echo "Unsupported target name: ${{ github.event.inputs.target_name }}" >&2
            exit 1
          fi
          echo "target=${SELECTED}" >> "$GITHUB_OUTPUT"

      - name: Resolve role ARN
        id: role
        run: |
          ROLE_ARN="$(python .github/scripts/resolve_role_arn.py '${{ steps.select.outputs.target }}')"
          echo "role_arn=${ROLE_ARN}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.role_arn }}
          aws-region: ap-northeast-1

      - name: Chain to OrganizationAccountAccessRole
        if: >-
          fromJson(steps.select.outputs.target).kind == 'workload-bootstrap' &&
          !fromJson(steps.select.outputs.target).deploy_role_ready
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ fromJson(steps.select.outputs.target).account_id }}:role/OrganizationAccountAccessRole
          aws-region: ap-northeast-1
          role-chaining: true

      - uses: hashicorp/setup-terraform@v3

      - name: Compute backend key
        id: backend
        run: |
          KIND="$(echo '${{ steps.select.outputs.target }}' | jq -r '.kind')"
          NAME="$(echo '${{ steps.select.outputs.target }}' | jq -r '.workload_name // ""')"
          ENV="$(echo '${{ steps.select.outputs.target }}' | jq -r '.environment // ""')"
          if [ "$KIND" = "workload-bootstrap" ]; then
            echo "key=workloads/${NAME}/${ENV}/account-bootstrap/terraform.tfstate" >> "$GITHUB_OUTPUT"
          elif [ "$KIND" = "workload" ]; then
            echo "key=workloads/${NAME}/${ENV}/terraform.tfstate" >> "$GITHUB_OUTPUT"
          else
            echo "key=" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform init
        working-directory: ${{ fromJson(steps.select.outputs.target).path }}
        run: |
          KEY="${{ steps.backend.outputs.key }}"
          if [ -n "$KEY" ]; then
            terraform init -backend-config=backend.hcl -backend-config="key=${KEY}"
          else
            terraform init -backend-config=backend.hcl
          fi

      - name: Terraform apply
        working-directory: ${{ fromJson(steps.select.outputs.target).path }}
        env:
          TF_VAR_environment: ${{ fromJson(steps.select.outputs.target).environment }}
          TF_VAR_vpc_cidr: ${{ fromJson(steps.select.outputs.target).vpc_cidr }}
          TF_VAR_workload_name: ${{ fromJson(steps.select.outputs.target).workload_name }}
        run: terraform apply -input=false -auto-approve
