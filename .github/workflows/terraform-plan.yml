name: terraform-plan

on:
  pull_request:
    paths:
      - "platform/**"
      - "workloads/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: targets
        run: |
          TARGETS="$(python .github/scripts/discover_targets.py)"
          echo "targets=${TARGETS}" >> "$GITHUB_OUTPUT"

      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | jq -R -s -c 'split("\n")[:-1]')"
          else
            DEFAULT_BRANCH='${{ github.event.repository.default_branch }}'
            CHANGED="$(git diff --name-only "origin/${DEFAULT_BRANCH}" "$GITHUB_SHA" | jq -R -s -c 'split("\n")[:-1]')"
          fi
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

  plan:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip unrelated targets
        id: match
        run: |
          TARGET='${{ toJson(matrix.target) }}'
          CHANGED='${{ needs.discover.outputs.changed }}'
          MATCHED="$(python .github/scripts/filter_changed_targets.py "[$TARGET]" "$CHANGED")"
          if [ "$MATCHED" = "[]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop early when target is unchanged
        if: steps.match.outputs.skip == 'true'
        run: echo "Skipping unchanged target ${{ matrix.target.path }}"

      - name: Resolve role ARN
        if: steps.match.outputs.skip != 'true'
        id: role
        run: |
          ROLE_ARN="$(python .github/scripts/resolve_role_arn.py '${{ toJson(matrix.target) }}')"
          echo "role_arn=${ROLE_ARN}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.match.outputs.skip != 'true'
        with:
          role-to-assume: ${{ steps.role.outputs.role_arn }}
          aws-region: ap-northeast-1

      - name: Chain to OrganizationAccountAccessRole
        if: >-
          steps.match.outputs.skip != 'true' &&
          matrix.target.kind == 'workload-bootstrap' &&
          matrix.target.deploy_role_ready == false
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.target.account_id }}:role/OrganizationAccountAccessRole
          aws-region: ap-northeast-1
          role-chaining: true

      - uses: hashicorp/setup-terraform@v3
        if: steps.match.outputs.skip != 'true'

      - name: Compute backend key
        if: steps.match.outputs.skip != 'true'
        id: backend
        run: |
          KIND="${{ matrix.target.kind }}"
          NAME="${{ matrix.target.workload_name }}"
          ENV="${{ matrix.target.environment }}"
          if [ "$KIND" = "workload-bootstrap" ]; then
            echo "key=workloads/${NAME}/${ENV}/account-bootstrap/terraform.tfstate" >> "$GITHUB_OUTPUT"
          elif [ "$KIND" = "workload" ]; then
            echo "key=workloads/${NAME}/${ENV}/terraform.tfstate" >> "$GITHUB_OUTPUT"
          else
            echo "key=" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform init
        if: steps.match.outputs.skip != 'true'
        working-directory: ${{ matrix.target.path }}
        run: |
          KEY="${{ steps.backend.outputs.key }}"
          if [ -n "$KEY" ]; then
            terraform init -backend-config=backend.hcl -backend-config="key=${KEY}"
          else
            terraform init -backend-config=backend.hcl
          fi

      - name: Terraform fmt
        if: steps.match.outputs.skip != 'true'
        working-directory: ${{ matrix.target.path }}
        run: terraform fmt -check -recursive

      - name: Terraform validate
        if: steps.match.outputs.skip != 'true'
        working-directory: ${{ matrix.target.path }}
        run: terraform validate

      - name: Terraform plan
        if: steps.match.outputs.skip != 'true'
        id: plan
        working-directory: ${{ matrix.target.path }}
        env:
          TF_VAR_environment: ${{ matrix.target.environment }}
          TF_VAR_vpc_cidr: ${{ matrix.target.vpc_cidr }}
          TF_VAR_workload_name: ${{ matrix.target.workload_name }}
          TF_VAR_additional_github_repos: ${{ toJson(matrix.target.additional_github_repos) }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color 2>&1 | tee /tmp/plan_output.txt

      - name: Post plan result to PR
        if: always() && steps.match.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/plan_output.txt', 'utf8');
            const target = '${{ matrix.target.name }}';
            const succeeded = '${{ steps.plan.outcome }}' === 'success';
            const noChanges = output.includes('No changes.');

            const icon = !succeeded ? '❌' : noChanges ? '✅' : '🔄';
            const summary = !succeeded ? 'Plan failed' : noChanges ? 'No changes' : 'Changes detected';
            const MAX = 50000;
            const truncated = output.length > MAX
              ? output.slice(0, MAX) + '\n... (truncated)'
              : output;

            const marker = `<!-- terraform-plan:${target} -->`;
            const body = `${marker}
            ### ${icon} \`${target}\` — ${summary}
            <details><summary>Show plan output</summary>

            \`\`\`
            ${truncated}
            \`\`\`
            </details>`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  all-plans-passed:
    needs: [plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All plans passed
        run: |
          if [ "${{ needs.plan.result }}" != "success" ]; then
            echo "One or more plan jobs failed"
            exit 1
          fi
