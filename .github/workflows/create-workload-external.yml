name: create-workload-external

on:
  workflow_dispatch:
    inputs:
      workload_name:
        description: "Workload name (e.g. my-service)"
        required: true
        type: string
      prod_email:
        description: "AWS account email for prod (e.g. me+myservice-prod@example.com)"
        required: true
        type: string
      test_email:
        description: "AWS account email for test (required when environments = prod,test)"
        required: false
        type: string
      cidr_tier:
        description: "Tier for VPC CIDR allocation (C = normal service, D = microservice)"
        required: true
        type: choice
        default: C
        options:
          - C
          - D
      environments:
        description: "Environments to create"
        required: true
        type: choice
        default: prod
        options:
          - prod
          - prod,test
      terraform_repo:
        description: "External Terraform repository (e.g. org/repo-name)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install filelock

      - name: Scaffold workload
        run: |
          python .github/scripts/new_workload.py \
            "${{ github.event.inputs.workload_name }}" \
            "${{ github.event.inputs.environments }}" \
            "${{ github.event.inputs.cidr_tier }}" \
            "${{ github.event.inputs.prod_email }}" \
            "${{ github.event.inputs.test_email }}"

      - name: Configure for external repo
        run: |
          NAME="${{ github.event.inputs.workload_name }}"
          TERRAFORM_REPO="${{ github.event.inputs.terraform_repo }}"

          # Add terraform_repo to metadata.json
          python - <<PYEOF
          import json
          path = f"workloads/${NAME}/metadata.json"
          with open(path) as f:
              meta = json.load(f)
          meta["terraform_repo"] = "${TERRAFORM_REPO}"
          with open(path, "w") as f:
              json.dump(meta, f, indent=2)
              f.write("\n")
          PYEOF

          # Add additional_github_repos to account-bootstrap/terraform.auto.tfvars
          echo "additional_github_repos  = [\"${TERRAFORM_REPO}\"]" \
            >> "workloads/${NAME}/account-bootstrap/terraform.auto.tfvars"

          # Remove envs/ — Terraform is managed in the external repo
          rm -rf "workloads/${NAME}/envs"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="${{ github.event.inputs.workload_name }}"
          ENVS="${{ github.event.inputs.environments }}"
          TERRAFORM_REPO="${{ github.event.inputs.terraform_repo }}"
          BRANCH="add-workload/${NAME}"

          git checkout -b "$BRANCH"
          git add "workloads/${NAME}/" ".repo-meta/"
          git commit -m "feat: add workload ${NAME} (external: ${TERRAFORM_REPO})"
          git push --force origin "$BRANCH"

          gh pr list --head "$BRANCH" --json number --jq '.[0].number' | grep -q . || \
          gh pr create \
            --title "[1/3] feat: add workload ${NAME}" \
            --body "$(cat <<EOF
          ## Add workload: \`${NAME}\` (external repo)

          - **Environments:** \`${ENVS}\`
          - **Terraform repo:** \`${TERRAFORM_REPO}\`

          Terraform code is managed in [\`${TERRAFORM_REPO}\`](https://github.com/${TERRAFORM_REPO}). This repo handles account creation and bootstrapping only.

          Merging this PR will automatically trigger AWS account creation and kick off the provisioning sequence. Two more PRs will follow — merge them in order as each appears.

          After all 3 PRs are merged, set up \`WORKLOAD_NAME\`, \`PROD_ACCOUNT_ID\`$([ "$ENVS" = "prod,test" ] && echo ", \`TEST_ACCOUNT_ID\`") as repository variables in \`${TERRAFORM_REPO}\` and place Terraform code following \`workloads/_external_template/README.md\`.
          EOF
          )"
