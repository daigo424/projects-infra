name: create-project-external

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Project name (e.g. my-project)"
        required: true
        type: string
      prod_email:
        description: "AWS account email for prod (e.g. me+myproject-prod@example.com)"
        required: true
        type: string
      test_email:
        description: "AWS account email for test (required when environments = prod,test)"
        required: false
        type: string
      prod_cidr:
        description: "VPC CIDR block for prod (e.g. 10.1.0.0/16)"
        required: true
        type: string
      test_cidr:
        description: "VPC CIDR block for test (required when environments = prod,test)"
        required: false
        type: string
      environments:
        description: "Environments to create"
        required: true
        type: choice
        default: prod
        options:
          - prod
          - prod,test
      terraform_repo:
        description: "External Terraform repository (e.g. org/repo-name)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install filelock

      - name: Scaffold project
        run: |
          python .github/scripts/new_project.py \
            "${{ github.event.inputs.project_name }}" \
            "${{ github.event.inputs.environments }}" \
            "${{ github.event.inputs.prod_cidr }}" \
            "${{ github.event.inputs.prod_email }}" \
            "${{ github.event.inputs.test_cidr }}" \
            "${{ github.event.inputs.test_email }}"

      - name: Configure for external repo
        run: |
          NAME="${{ github.event.inputs.project_name }}"
          TERRAFORM_REPO="${{ github.event.inputs.terraform_repo }}"

          # Add terraform_repo to metadata.json
          python - <<PYEOF
          import json
          path = f"projects/${NAME}/metadata.json"
          with open(path) as f:
              meta = json.load(f)
          meta["terraform_repo"] = "${TERRAFORM_REPO}"
          with open(path, "w") as f:
              json.dump(meta, f, indent=2)
              f.write("\n")
          PYEOF

          # Add additional_github_repos to account-bootstrap/terraform.auto.tfvars
          echo "additional_github_repos  = [\"${TERRAFORM_REPO}\"]" \
            >> "projects/${NAME}/account-bootstrap/terraform.auto.tfvars"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="${{ github.event.inputs.project_name }}"
          ENVS="${{ github.event.inputs.environments }}"
          TERRAFORM_REPO="${{ github.event.inputs.terraform_repo }}"
          BRANCH="add-project/${NAME}"

          git checkout -b "$BRANCH"
          git add "projects/${NAME}/" ".repo-meta/"
          git commit -m "feat: add project ${NAME} (external: ${TERRAFORM_REPO})"
          git push --force origin "$BRANCH"

          gh pr list --head "$BRANCH" --json number --jq '.[0].number' | grep -q . || \
          gh pr create \
            --title "[1/3] feat: add project ${NAME}" \
            --body "$(cat <<EOF
          ## Add project: \`${NAME}\` (external repo)

          - **Environments:** \`${ENVS}\`
          - **Terraform repo:** \`${TERRAFORM_REPO}\`

          Terraform code is managed in [\`${TERRAFORM_REPO}\`](https://github.com/${TERRAFORM_REPO}). This repo handles account creation and bootstrapping only.

          Merging this PR will automatically trigger AWS account creation and kick off the provisioning sequence. Two more PRs will follow — merge them in order as each appears.

          After all 3 PRs are merged, set up \`PROJECT_NAME\`, \`PROD_ACCOUNT_ID\`$([ "$ENVS" = "prod,test" ] && echo ", \`TEST_ACCOUNT_ID\`") as repository variables in \`${TERRAFORM_REPO}\` and place Terraform code following \`projects/_external_template/README.md\`.
          EOF
          )"
